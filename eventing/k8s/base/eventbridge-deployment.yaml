# EventBridge — the face of the demo. Single replica BY CONSTRAINT (§8.6).
#
# The event store is SQLite on local disk. Two replicas means two divergent
# databases behind one Service, and the HTML view would show different history
# depending on which pod answered. `kafka_requests_mirror.py` also uses a
# per-process consumer group with no commits so every start re-scans the topic —
# sane for one pod, duplicative for many. So: replicas 1, no HPA, no
# ScaledObject, and strategy Recreate to avoid two pods sharing a volume during a
# rollout. This is a constraint to state, not a limitation to fix; sharing the
# store means replacing SQLite, which is out of scope.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventbridge
  labels:
    app.kubernetes.io/name: eventbridge
    app.kubernetes.io/part-of: rossoctl-eventing
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: eventbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eventbridge
        app.kubernetes.io/part-of: rossoctl-eventing
    spec:
      # NOTE: no runAsUser. On OpenShift the SCC assigns one from the namespace
      # range (1000910000/10000 here) and overrides the image's USER; setting it
      # ourselves would fight that. The image is built so an arbitrary UID works:
      # every writable path is group-0 owned and group-writable (§8.5).
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      containers:
        - name: eventbridge
          image: quay.io/aslomnet/rossoctl-eventbridge:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: eventing-config
            # ntfy phone fan-out. An ntfy topic name is a CAPABILITY — anyone who
            # knows it can both read and publish your notifications — so it is never
            # committed. k8s_deploy.py creates this Secret from NTFY_TOPIC in your
            # environment; `optional: true` means the overlays that do not use ntfy
            # are unaffected when it is absent.
            #
            # Listed AFTER the ConfigMap deliberately: for a key present in several
            # envFrom sources the last source wins, which is how NTFY_ENABLED=true
            # here overrides the ConfigMap's "false".
            - secretRef:
                name: eventbridge-ntfy
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            # §11. Appended, not inserted: the demo overlay JSON-patches
            # `/spec/template/spec/volumes/0` to swap `data` for a PVC, so anything
            # placed before `data` would be replaced instead of it.
            - name: signing-key
              mountPath: /etc/ce-signing
              readOnly: true
            - name: keyset
              mountPath: /etc/ce-keyset
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          emptyDir: {}
        # §11 — the seed EventBridge signs requests and group lifecycle events with.
        # NOT declared in any manifest: `k8s_deploy.py --signing-keys` applies the
        # Secret via stdin, because a kustomize secretGenerator would inline the seed
        # into `kubectl kustomize` output and `--from-literal` would leak it to argv.
        #
        # `optional: true` keeps signing-less overlays working — without it the pod
        # blocks in ContainerCreating waiting for a Secret that will never exist. No
        # `defaultMode`: 0400 would be root-only, and with no `runAsUser`/`fsGroup`
        # (OpenShift assigns the UID) the default 0644 is what makes it readable.
        # A Secret PER SERVICE, not one shared between them. A single seed would mean
        # EventBridge holds the key it verifies runner responses with, so it could
        # forge any agent's answer and an agent could forge another's — which is the
        # exact property that made HMAC unacceptable (DESIGN_PHASE2.md §4.3). Two
        # Secrets is what keeps "only this agent could have produced this" true.
        - name: signing-key
          secret:
            secretName: eventbridge-signing-key
            optional: true
        # The approved-key set — `kid` -> public key. A ConfigMap, never a Secret: a
        # 32-byte seed is indistinguishable from a public key by length, so keeping
        # the set somewhere a Secret is not is what makes a pasted private key
        # obvious in review (shared/keyset.py).
        - name: keyset
          configMap:
            name: eventing-keyset
            optional: true
